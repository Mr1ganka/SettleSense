services:
  postgres:
    image: postgres:16-alpine
    container_name: settlesense-postgres
    environment:
      POSTGRES_DB: settlesense
      POSTGRES_USER: settlesense
      POSTGRES_PASSWORD: settlesense
    ports:
      - "5432:5432"
    volumes:
      - settlesense-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlesense -d settlesense"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: settlesense-redis
    ports:
      - "6379:6379"
    volumes:
      - settlesense-redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  settlesense-redis-data:
  settlesense-postgres-data:
