spring.application.name=settlesense

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/settlesense}
spring.datasource.username=${DATABASE_USERNAME:settlesense}
spring.datasource.password=${DATABASE_PASSWORD:settlesense}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

rate-limit.capacity=${RATE_LIMIT_CAPACITY:60}
rate-limit.refill-tokens-per-second=${RATE_LIMIT_REFILL_TOKENS_PER_SECOND:1}
rate-limit.bucket-ttl=${RATE_LIMIT_BUCKET_TTL:15m}
rate-limit.redis-key-prefix=${RATE_LIMIT_REDIS_KEY_PREFIX:settlesense:ratelimit}
